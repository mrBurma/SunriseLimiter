name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "Tag v$TAG does not match Info.plist version $VERSION" >&2
            exit 1
          fi

      - name: Build universal app
        run: scripts/build-app.sh release

      - name: Package app and checksums
        shell: bash
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/Sunrise Limiter.app" "dist/Sunrise-Limiter-macOS-universal.zip"
          shasum -a 256 "dist/Sunrise-Limiter-macOS-universal.zip" > "dist/SHA256SUMS.txt"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md dist/
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Sunrise Limiter ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Sunrise-Limiter-macOS-universal.zip
            dist/SHA256SUMS.txt
            dist/README.md
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            dist/CHANGELOG.md

      - name: Upload build artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Limiter-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
